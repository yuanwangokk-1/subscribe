pr: &pr {type: select, proxies: [节点选择, 全部节点, 自动选择, DIRECT]}
p: &p {type: http, interval: 3600, health-check: {enable: true, url: https://cp.cloudflare.com, interval: 300, timeout: 1000, tolerance: 100}}
use: &use {type: url-test, use: [Aries]}

proxy-providers:
  Aries: {<<: *p, url: "https://gh-proxy.org/gist.githubusercontent.com/yuanwangokk-1/8397f61d8e27adc34afc2e2abde485cb/raw/98f543fea3e4c3b27a45730627a6d31bfbd7c601/All.conf"}

rule-providers:
  AWAvenue-Ads: {type: http, behavior: domain, format: yaml, path: ./rule_provider/AWAvenue-Ads.yaml, url: "https://gh-proxy.org/raw.githubusercontent.com/TG-Twilight/AWAvenue-Ads-Rule/refs/heads/main/Filters/AWAvenue-Ads-Rule-Clash-Classical.yaml", interval: 600}
  Fake-IP-Filter: {type: http, behavior: domain, format: mrs, interval: 86400, path: ./rule_provider/Fake-IP-Filter.mrs, url: "https://gh-proxy.org/github.com/DustinWin/ruleset_geodata/raw/refs/heads/mihomo-ruleset/fakeip-filter.mrs"}
  proxy_domain: {type: http, behavior: domain, format: mrs, interval: 86400, path: ./rule_provider/proxy_domain.mrs, url: "https://gh-proxy.org/github.com/DustinWin/ruleset_geodata/raw/refs/heads/mihomo-ruleset/proxy.mrs"}
  cn_ip: {type: http, behavior: ipcidr, format: mrs, interval: 86400, path: ./rule_provider/cn_ip.mrs, url: "https://gh-proxy.org/github.com/MetaCubeX/meta-rules-dat/raw/refs/heads/meta/geo/geoip/cn.mrs"}
  private_ip: {type: http, behavior: ipcidr, format: mrs, interval: 86400, path: ./rule_provider/private_ip.mrs, url: "https://gh-proxy.org/github.com/MetaCubeX/meta-rules-dat/raw/refs/heads/meta/geo/geoip/private.mrs"}
  cn_domain: {type: http, behavior: domain, format: mrs, interval: 86400, path: ./rule_provider/cn_domain.mrs, url: "https://gh-proxy.org/github.com/MetaCubeX/meta-rules-dat/raw/refs/heads/meta/geo/geosite/cn.mrs"}
  private_domain: {type: http, behavior: domain, format: mrs, interval: 86400, path: ./rule_provider/private_domain.mrs, url: "https://gh-proxy.org/github.com/MetaCubeX/meta-rules-dat/raw/refs/heads/meta/geo/geosite/private.mrs"}

mode: rule
ipv6: true
log-level: info
allow-lan: true
mixed-port: 7890
unified-delay: true
tcp-concurrent: true
external-controller: :9090
geodata-mode: false
geox-url: {geoip: "https://cdn.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@release/geoip.dat", geosite: "https://cdn.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@release/geosite.dat", mmdb: "https://cdn.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@release/country.mmdb"}
find-process-mode: strict
keep-alive-interval: 1800
global-client-fingerprint: random
profile: {store-selected: true, store-fake-ip: true}
ntp: {enable: true, write-to-system: false, server: time.apple.com, port: 123, interval: 30}
sniffer: {enable: true, sniff: {TLS: {ports: [443, 8443]}, HTTP: {ports: [80, 8080-8880], override-destination: true}}}
tun: {enable: false, stack: system, dns-hijack: ["any:53", "tcp://any:53"], auto-route: true, auto-detect-interface: true}

dns:
  enable: true
  listen: :1053
  ipv6: true
  enhanced-mode: fake-ip
  fake-ip-range: 28.0.0.1/8
  fake-ip-filter: ['+.lan', '+.local']
  default-nameserver: [223.5.5.5, 119.29.29.29, 114.114.114.114, '[2402:4e00::]', '[2400:3200::1]']
  nameserver: ['tls://8.8.4.4', 'tls://1.0.0.1', 'tls://[2001:4860:4860::8844]', 'tls://[2606:4700:4700::1001]']
  proxy-server-nameserver: [https://doh.pub/dns-query, https://dns.alidns.com/dns-query]
  nameserver-policy: 
    "geosite:cn": [https://doh.pub/dns-query, https://dns.alidns.com/dns-query]
    "geosite:private": [https://doh.pub/dns-query, https://dns.alidns.com/dns-query]
    "geosite:!cn": ["tls://dns.google", "tls://cloudflare-dns.com"]
    "geosite:!private": ["tls://dns.google", "tls://cloudflare-dns.com"]

proxies: []

proxy-groups:
  # ==================== 基础节点组 ====================
  - name: 全部节点
    type: url-test
    use: [Aries]
    interval: 3600

  - name: 自动选择
    type: url-test
    use: [Aries]
    tolerance: 2
    interval: 3600

  - name: 节点选择
    type: select
    proxies:
      - 全部节点
      - 自动选择
      - DIRECT

  # ==================== DNS 专用组 ====================
  - name: dns
    type: select
    proxies:
      - 节点选择
      - 全部节点
      - 自动选择
      - DIRECT

  # ==================== 广告拦截 ====================
  - name: 广告拦截
    type: select
    proxies:
      - REJECT
      - DIRECT
      - 节点选择

  # ==================== 学术与 AI ====================
